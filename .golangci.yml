# golangci-lint config. Tuned to enforce the rules in docs/conventions/go-style.md
# and docs/process/code-cleanliness.md without false-positive noise.

run:
  timeout: 5m
  go: "1.22"

linters:
  disable-all: true
  enable:
    - errcheck       # unchecked errors
    - govet          # the basics; catches the import-error trap
    - staticcheck    # bug catches
    - gosec          # security smells
    - revive         # style + complexity
    - ineffassign    # unused assignments
    - unused         # dead code
    - misspell       # typos
    - bodyclose      # http response leaks
    - rowserrcheck   # sql.Rows leaks
    - sqlclosecheck  # sql.Stmt / sql.Rows close
    - contextcheck   # context propagation
    - errorlint      # %w wrapping
    - gocritic       # broad correctness lints
    - gosimple
    - nakedret       # naked returns hide intent
    - prealloc       # slice prealloc

linters-settings:
  errcheck:
    exclude-functions:
      - (io.Closer).Close   # defer .Close() pattern is idiomatic
  revive:
    rules:
      - name: function-length
        arguments: [100, 0]   # 100-line cap (per file-size-limits.md)
      - name: cognitive-complexity
        arguments: [25]
      - name: argument-limit
        arguments: [6]
  gosec:
    excludes:
      - G104   # noisy with errcheck overlap
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - bin
    - frontend
    - .swarm
  exclude-rules:
    - path: _test\.go
      linters: [gosec, gocritic, prealloc]   # tests have different rules
