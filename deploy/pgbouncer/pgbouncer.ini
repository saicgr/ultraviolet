; PgBouncer config for Ultraviolet control-plane.
; transaction pooling is safe for our usage — no LISTEN/NOTIFY, no SET LOCAL
; across multiple statements. Pool size tuned for the api + sync binaries to
; share ~20 server connections.

[databases]
uv = host=postgres port=5432 dbname=uv

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
default_pool_size = 20
min_pool_size = 4
reserve_pool_size = 4
reserve_pool_timeout = 3
max_client_conn = 500
server_idle_timeout = 600
server_lifetime = 3600
query_wait_timeout = 30

; Logging — JSON-friendly fields so we can ship to the existing stack.
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; Admin / stats user (read-only).
admin_users = pgbouncer
stats_users = pgbouncer

; TLS — terminate on PgBouncer for client connections in prod. For local
; docker-compose we leave it plaintext on a private network.
;client_tls_sslmode = require
;client_tls_cert_file = /etc/pgbouncer/tls/server.crt
;client_tls_key_file  = /etc/pgbouncer/tls/server.key

; Upstream — verify-full in prod.
;server_tls_sslmode = verify-full
;server_tls_ca_file = /etc/pgbouncer/tls/upstream-ca.crt
