# Ultraviolet dev environment
# Starts: Postgres (control plane), Redis (pubsub + freshness cache), LocalStack (S3 emulator),
# and stubs for the three UV binaries (proxy, api, sync) + frontend dev server.
#
# Usage: `make dev` (starts only postgres+redis+localstack), or `docker compose up`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: uv-postgres
    environment:
      POSTGRES_USER: uv
      POSTGRES_PASSWORD: uv
      POSTGRES_DB: uv
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uv -d uv"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: uv-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: uv-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: 0
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack-data:/var/lib/localstack

